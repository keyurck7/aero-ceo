# Sources, Admiralty source grading and collection plan (ADR 0008).
# Analyst-maintained: edit categories here, then run `aero sources grade` to apply them to the database.

version: admiralty-2026-11-08
licence_review_required: true
full_text_policy: research_mode
notes: licence must be reviewed per source before production use (finding P3). 'unknown' = store headline + link + short snippet
  only.
grading:
  standard: 'NATO Admiralty code (AJP-2.1): source reliability A-F, assessed separately from the information'
  policy: the analyst records a category per publisher; aero.domain.CATEGORY_RELIABILITY maps category to grade (official_primary
    A, established_newsroom B, specialist_or_commentary C, aggregator_or_ugc D, off_topic_or_spam E, unreviewed F). Unlisted
    publishers are F. Exact name match only.
  status: DRAFT by Claude 2026-11-08 from publisher type; owner review pending (docs/plan-no-heuristics.md §6)
