# Drill-down actions -> MCP prompts on strategy-mcp
# Generated by scripts/v2/extract_v1_seeds.py from v1 code; edit freely.

version: v1-import-2026-11-07
prompts:
- name: why_this_recommendation
  title: Why this recommendation?
  instruction: Explain why Airbus should prioritize this recommendation. Include strategic logic, evidence, risks,
    and expected impact.
- name: show_strongest_evidence
  title: Show strongest evidence
  instruction: Show the strongest evidence supporting this recommendation. Rank the evidence and explain why it
    matters.
- name: lower_risk_version
  title: Lower-risk version
  instruction: Create a lower-risk version of this recommendation. Preserve strategic value but reduce financial,
    operational, and political risk.
- name: budget_constrained_version
  title: Budget-constrained version
  instruction: Assume Airbus has limited budget. What should management do first, what should be delayed, and what
    should be avoided?
- name: partnership_options
  title: Partnership options
  instruction: Identify possible partner organizations and countries that could help Airbus execute this recommendation.
    Include capability fit, collaboration area, and risks.
- name: next_6_months_action_plan
  title: Next 6 months action plan
  instruction: Convert this recommendation into a practical 6-month action plan for Airbus leadership.
- name: what_could_go_wrong
  title: What could go wrong?
  instruction: Stress-test this recommendation. Identify failure modes, early warning signs, and mitigation actions.
